name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm install
      # Signs + notarizes the macOS app when the Apple secrets are set in the
      # repo (Settings → Secrets and variables → Actions); otherwise the build
      # stays unsigned. See README → "Signing the macOS build".
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No Apple signing secrets set; building an unsigned app."
            exit 0
          fi
          # Check the certificate before handing it to the build, so mistakes
          # produce a clear message instead of a failed `tauri build`.
          CERT="$RUNNER_TEMP/check.p12"
          KC="$RUNNER_TEMP/check.keychain-db"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT" 2>/dev/null || [ ! -s "$CERT" ]; then
            echo "::error::APPLE_CERTIFICATE isn't valid base64. Re-create it with: base64 -i cert.p12 | tr -d '\n' | gh secret set APPLE_CERTIFICATE"
            exit 1
          fi
          security create-keychain -p check "$KC"
          security unlock-keychain -p check "$KC"
          if ! security import "$CERT" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null; then
            echo "::error::Couldn't import APPLE_CERTIFICATE: wrong APPLE_CERTIFICATE_PASSWORD, or the .p12 doesn't contain the private key (export it from 'My Certificates' in Keychain Access)."
            exit 1
          fi
          ALL_IDS="$(security find-identity -p codesigning "$KC")"
          echo "Identities in the certificate:"; echo "$ALL_IDS"
          if ! grep -qF "\"$APPLE_SIGNING_IDENTITY\"" <<<"$ALL_IDS"; then
            echo "::error::APPLE_SIGNING_IDENTITY ('$APPLE_SIGNING_IDENTITY') doesn't match the certificate. It must be a 'Developer ID Application: …' identity (not 'Apple Development' / 'Apple Distribution'); see the list above."
            exit 1
          fi
          if ! security find-identity -v -p codesigning "$KC" | grep -qF "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "Certificate chain incomplete on this runner: installing Apple's Developer ID intermediate certificates."
            for c in DeveloperIDG2CA.cer DeveloperIDCA.cer; do
              curl -fsSL "https://www.apple.com/certificateauthority/$c" -o "$RUNNER_TEMP/$c" &&
                sudo security import "$RUNNER_TEMP/$c" -k /Library/Keychains/System.keychain || true
            done
            if ! security find-identity -v -p codesigning "$KC" | grep -qF "\"$APPLE_SIGNING_IDENTITY\""; then
              echo "::error::The signing certificate isn't valid (expired or revoked?). Valid identities:"
              security find-identity -v -p codesigning "$KC"
              exit 1
            fi
          fi
          security delete-keychain "$KC"; rm -f "$CERT"
          echo "✓ Certificate OK: $APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            # Notarize with an App Store Connect API key (preferred).
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$KEY_PATH"
            } >> "$GITHUB_ENV"
            echo "Signing + notarizing with an App Store Connect API key."
          elif [ -n "$APPLE_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Signing + notarizing with an Apple ID."
          else
            echo "::warning::Signing WITHOUT notarization: add the secrets APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8 (or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID). Users will see a Gatekeeper warning until then."
          fi
      - run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: copilot-pacer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  # On a version tag (e.g. v0.1.0): publish a release whose installers have
  # fixed names, so README links like
  # releases/latest/download/Copilot-Pacer-macOS.dmg always work.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Rename installers
        run: |
          mkdir release
          cp artifacts/copilot-pacer-universal-apple-darwin/dmg/*.dmg release/Copilot-Pacer-macOS.dmg
          cp artifacts/copilot-pacer-x86_64-pc-windows-msvc/nsis/*.exe release/Copilot-Pacer-Windows-Setup.exe
          cp artifacts/copilot-pacer-x86_64-pc-windows-msvc/msi/*.msi release/Copilot-Pacer-Windows.msi
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          name: Copilot Pacer ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: release/*
